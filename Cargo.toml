[package]
name = "segrep"
version = "0.1.0"
edition = "2021"
description = "A semantic grep tool that uses embeddings to find semantically similar text"
authors = ["Your Name <your.email@example.com>"]
license = "Apache-2.0"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

rust-bert = "0.23.0"  # or the latest version available

# Tokenization
tokenizers = { version = "0.21", features = ["onig", "http"] }

# Tensor operations and ML
tch = { version = "0.17", features = ["download-libtorch"] } 

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for potential future enhancements)
tokio = { version = "1.32", features = ["full"] }

[dependencies.once_cell]
version = "1.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
rstest = "0.18.2"
pretty_assertions = "1.4.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false


